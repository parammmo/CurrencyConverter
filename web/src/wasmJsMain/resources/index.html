<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <!--
      viewport-fit=cover: die Seite darf bis unter Notch und Home-Indicator
      reichen; die Safe-Areas holen wir uns unten per CSS zurück.
      user-scalable=no: sonst zoomt Safari bei schnellen Doppeltipps auf dem
      Ziffernblock.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <!-- Wird von Theme.kt beim Umschalten hell/dunkel nachgeführt. -->
    <meta name="theme-color" content="#f6f1ea">
    <title>Currency Converter</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            /* Startfarbe, bis Compose läuft; Theme.kt setzt sie danach passend. */
            background: #f6f1ea;
        }
        /*
          Der Canvas füllt nicht den ganzen Bildschirm, sondern den Bereich
          zwischen den iOS-Safe-Areas (Statusleiste, Home-Indicator). Die
          Streifen außenrum zeigen die body-Hintergrundfarbe — deshalb muss die
          zum Theme passen.
        */
        #app {
            position: fixed;
            top: env(safe-area-inset-top, 0);
            right: env(safe-area-inset-right, 0);
            bottom: env(safe-area-inset-bottom, 0);
            left: env(safe-area-inset-left, 0);
        }
    </style>
    <script type="application/javascript" src="web.js"></script>
</head>
<body>
<div id="app"></div>
</body>
</html>
