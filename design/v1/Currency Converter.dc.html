<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1050,&quot;height&quot;:1010},&quot;xmrPriceEur&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:285.7,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:1,&quot;max&quot;:2000,&quot;step&quot;:0.1,&quot;section&quot;:&quot;Rates&quot;,&quot;unit&quot;:&quot;EUR&quot;},&quot;decimalDot&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Format&quot;}}">
class Component extends DCLogic {
  state = { L: this.mk(), D: this.mk() };
  mk() { return { entry: '0', acc: null, op: null, fresh: false, active: 'top', cur: ['EUR', 'XMR'] }; }
  parse(s) { return parseFloat(String(s).replace(',', '.')) || 0; }
  raw(n) {
    if (!isFinite(n)) return '0';
    let s = Math.abs(n) >= 1e10 ? n.toExponential(4) : String(Math.round(n * 1e6) / 1e6);
    if (s.length > 11) s = Number(n.toPrecision(8)).toString();
    return s.replace('.', ',');
  }
  disp(s) { return this.props.decimalDot ? String(s).replace(',', '.') : String(s); }
  valEur(c) { return c === 'EUR' ? 1 : (this.props.xmrPriceEur ?? 285.7); }
  conv(amt, from, to) { return amt * this.valEur(from) / this.valEur(to); }
  calc(a, op, b) { return op === '+' ? a + b : op === '-' ? a - b : op === '*' ? a * b : b === 0 ? 0 : a / b; }
  tap(key, k) {
    this.setState(s => {
      const st = { ...s[key] };
      if ('0123456789'.includes(k)) {
        if (st.fresh || st.entry === '0') { st.entry = k; st.fresh = false; }
        else if (st.entry.length < 10) st.entry += k;
      } else if (k === ',') {
        if (st.fresh) { st.entry = '0,'; st.fresh = false; }
        else if (!st.entry.includes(',')) st.entry += ',';
      } else if (k === 'C') { st.entry = '0'; st.acc = null; st.op = null; st.fresh = false; }
      else if (k === 'bs') { st.entry = st.entry.length > 1 ? st.entry.slice(0, -1) : '0'; st.fresh = false; }
      else if (k === '%') { st.entry = this.raw(this.parse(st.entry) / 100); st.fresh = true; }
      else if (k === 'swap') { st.cur = [st.cur[1], st.cur[0]]; }
      else if (k === '=') {
        if (st.op != null) { st.entry = this.raw(this.calc(st.acc, st.op, this.parse(st.entry))); st.op = null; st.acc = null; st.fresh = true; }
      } else { // + - * /
        if (st.op != null && !st.fresh) st.entry = this.raw(this.calc(st.acc, st.op, this.parse(st.entry)));
        st.acc = this.parse(st.entry); st.op = k; st.fresh = true;
      }
      return { [key]: st };
    });
  }
  vals(key, ringOn, ringOff) {
    const st = this.state[key];
    const [cT, cB] = st.cur;
    const icon = c => c === 'EUR' ? '#3B5BA5' : '#C0562B';
    const glyph = c => c === 'EUR' ? '\u20AC' : '\u0271';
    const eVal = this.parse(st.entry);
    const other = this.raw(st.active === 'top' ? this.conv(eVal, cT, cB) : this.conv(eVal, cB, cT));
    const topAmt = st.active === 'top' ? st.entry : other;
    const botAmt = st.active === 'bot' ? st.entry : other;
    return {
      ['curTop' + key]: cT, ['curBot' + key]: cB,
      ['topGlyph' + key]: glyph(cT), ['botGlyph' + key]: glyph(cB),
      ['topIconBg' + key]: icon(cT), ['botIconBg' + key]: icon(cB),
      ['topAmt' + key]: this.disp(topAmt), ['botAmt' + key]: this.disp(botAmt),
      ['topRing' + key]: st.active === 'top' ? ringOn : ringOff,
      ['botRing' + key]: st.active === 'bot' ? ringOn : ringOff,
      ['rateLine' + key]: '1 ' + cT + ' = ' + this.disp(this.raw(this.conv(1, cT, cB))) + ' ' + cB,
      ['tap' + key]: e => this.tap(key, e.currentTarget.dataset.k),
      ['focus' + key]: e => { const f = e.currentTarget.dataset.f; this.setState(s => ({ [key]: { ...s[key], active: f, entry: '0', acc: null, op: null, fresh: false } })); },
    };
  }
  renderVals() {
    const d = new Date();
    const p = n => String(n).padStart(2, '0');
    return {
      dateStr: p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()),
      ...this.vals('L', '0 0 0 2px #A6401F', '0 1px 2px rgba(60,30,15,0.05)'),
      ...this.vals('D', '0 0 0 2px #C55A31', 'none'),
    };
  }
}
